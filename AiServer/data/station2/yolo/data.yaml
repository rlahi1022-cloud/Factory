# YOLO11 Dataset Configuration — Station2 조립 검사용
# =========================================================
# TrainYolo.py 가 이 파일을 읽어 학습을 실행한다.
# path 는 이 파일과 같은 폴더 기준의 절대 경로이며, 실행 환경에 따라 다름.
#   Windows 네이티브 : C:\Users\LMS\...\data\station2\yolo
#   WSL (Ubuntu)    : /mnt/c/Users/LMS/.../data/station2/yolo
# Ultralytics 는 path 를 무시하고 상대경로로 자동 찾을 때가 많지만, 안전하게 적어둠.

path: ./
train: images/train
val: images/val
test: images/test

# 클래스 정의 (YoloTrainer.CLASS_NAMES 와 일치해야 함)
names:
  0: cap
  1: label
  2: liquid_level

nc: 3
